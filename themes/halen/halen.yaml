enabled: true

# Child theme of Quark 2: files in this folder win, everything else comes from user/themes/quark2.
streams:
  schemes:
    theme:
      type: ReadOnlyStream
      prefixes:
        '':
          - 'user://themes/halen'
          - 'user://themes/quark2'
        # Twig namespace @simplesearch for the plugin's original templates
        'simplesearch/':
          - 'user://plugins/simplesearch'
        # @quark2 for extending Quark 2 templates of the same name
        'quark2/':
          - 'user://themes/quark2'

# Quark 2 options. A child theme does not inherit the parent's config, so all of them are listed.
header-fixed: true
header-animated: false
header-transparent: false
header-dark: false
header-light: false
sticky-footer: true
theme-mode: light
accent-color: '#2f5a3c'
blog-page: '/blog'
custom_logo:
  - name: halen.svg
custom_logo_mobile:
  - name: halen.svg
custom_favicon:
  - name: favicon.svg
fontawesome:
  enabled: true
  local: true

# Sidebar on every blog list (Quark 2 default: only on posts).
show_sidebar: true
